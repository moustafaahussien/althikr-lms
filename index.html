<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- سياسة أمان: المواقع المسموح للصفحة تحميل الأكواد منها والاتصال بها -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://zpbhzhpvpvehowxvlsgp.supabase.co https://drive.google.com https://*.googleusercontent.com; connect-src 'self' https://zpbhzhpvpvehowxvlsgp.supabase.co wss://zpbhzhpvpvehowxvlsgp.supabase.co; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — منصة دار الذكر التعليمية</title>
  <link rel="stylesheet" href="assets/css/brand.css?v=202611231330">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#007B51">
  <link rel="manifest" href="supervision/manifest.json?v=2">
  <link rel="stylesheet" href="assets/css/app.css?v=202611260200">
</head>
<body>
  <div class="login-wrap">
    <div class="login glass">
      <img class="logo-full" src="assets/img/logo.png" alt="مدارس دار الذكر">
      <h1 id="pname">منصة دار الذكر التعليمية</h1>
      <p id="sname">مدارس دار الذكر</p>
      <div id="area"><div class="loader"><div class="spin"></div>جارٍ التحقق…</div></div>
    </div>
  </div>
  <footer class="credit" style="position:fixed;bottom:0;inset-inline:0">إعداد وتصميم: مصطفى حسين · <a href="privacy.html">سياسة الخصوصية</a></footer>

  <script src="assets/vendor/supabase-js-2.119.2.js"></script>
  <script src="assets/js/config.js?v=202611261900"></script>
  <script src="assets/js/i18n.js?v=202611262000"></script>
  <script src="assets/js/core.js?v=202611260200"></script>
  <script>
  (async function () {
    const { sb, C, configured, esc, $, signInWithGoogle, signOut, getContext, errMsg, rememberNext, takeNext } = LMS;
    rememberNext();
    $('#pname').textContent = C.PLATFORM_NAME;
    $('#sname').textContent = C.SCHOOL_NAME;
    const area = $('#area');

    const gIcon = `<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;

    const showLogin = (notice = '') => {
      area.innerHTML = `
        <p>سجّل الدخول بحسابك المدرسي <b dir="ltr">@${esc(C.SCHOOL_DOMAIN)}</b></p>
        <button class="btn primary gbtn" id="gbtn">${gIcon}<span>الدخول بحساب Google المدرسي</span></button>
        <div class="hint" style="margin:14px 0 6px">أولياء الأمور: ادخل بحساب ابنك المدرسي، ثم برمزك السري الخاص</div>
        <button class="btn gbtn" id="pbtn">${gIcon}<span>👪 دخول ولي الأمر</span></button>
        ${notice}`;
      $('#gbtn').onclick = () => signInWithGoogle();
      $('#pbtn').onclick = () => { try { sessionStorage.setItem('lms_next', 'parent.html'); } catch (_) {} signInWithGoogle(); };
      area.insertAdjacentHTML('beforeend', '<button type="button" class="demo-link" id="demoBtn">🎬 تجربة المنصة بحسابات تجريبية</button>');
      $('#demoBtn').onclick = showDemo;
    };

    // ---------- الوضع التجريبي: اختيار الدور ----------
    const DEMO_ROLES = [['admin', '🛠️', 'مدير النظام', 'كل الصلاحيات ولوحة الإدارة'], ['leadership', '🏛️', 'الإدارة العليا', 'إحصاءات المدرسة والاعتمادات'],
      ['principal', '🏫', 'مدير مرحلة', 'المرحلة المتوسطة'], ['supervisor', '🧭', 'مشرف', 'مشرف الرياضيات'],
      ['teacher', '👨‍🏫', 'معلم', 'معلم رياضيات'], ['student', '🎓', 'طالب', 'الصف الثاني المتوسط'], ['parent', '👪', 'ولي أمر', 'متابعة ابنين']];
    function showDemo() {
      area.innerHTML = `<h2 style="margin:0 0 4px;font-size:1.15rem">🎬 تجربة المنصة</h2>
        <p class="hint" style="margin:0">مدرسة افتراضية ببيانات وهمية بالكامل — جرّب أي دور بضغطة، ولا شيء يُحفظ ولا يمس البيانات الحقيقية.</p>
        <div class="demo-roles">${DEMO_ROLES.map(([k, ic, n, d]) => `<button type="button" data-role="${k}"><span>${ic}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div>
        <button type="button" class="demo-link" id="demoBack">→ رجوع لتسجيل الدخول</button>`;
      area.querySelector('.demo-roles').onclick = (e) => { const b = e.target.closest('[data-role]'); if (!b) return;
        try { sessionStorage.removeItem('lms_demo_db'); Object.keys(sessionStorage).filter((k) => k.startsWith('lms_c:')).forEach((k) => sessionStorage.removeItem(k)); sessionStorage.setItem('lms_demo', b.dataset.role); } catch (_) {}
        location.href = b.dataset.role === 'parent' ? 'parent.html' : 'home.html'; };
      $('#demoBack').onclick = () => { location.href = 'index.html'; };
    }
    // ?demo=1 ← الخروج من أي تجربة حالية وعرض اختيار الدور
    if (/[?&]demo=1/.test(location.search)) {
      try { ['lms_demo', 'lms_demo_db'].forEach((k) => sessionStorage.removeItem(k)); } catch (_) {}
      if (LMS.DEMO) { location.replace('index.html?demo=1'); return; }
      showDemo(); return;
    }

    if (!configured) {
      area.innerHTML = `<div class="notice warn">المنصة لم تُربط بقاعدة البيانات بعد. عدّل الملف <b dir="ltr">assets/js/config.js</b> وضع فيه رابط ومفتاح Supabase (راجع دليل الإعداد).</div>`;
      return;
    }

    // أخطاء عائدة من Google/Supabase في الرابط
    const qs = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
    if (qs.get('error_description')) {
      showLogin(`<div class="notice err">تعذّر الدخول: ${esc(qs.get('error_description'))}</div>`);
      return;
    }

    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showLogin(); return; }
      const ctx = await getContext(true);
      // المشرف يبدأ من مكتب الإشراف التربوي مباشرة (الرئيسية متاحة من الشريط العلوي)
      const nxt = takeNext();
      if (ctx && ctx.registered) { LMS.applyView(ctx); location.replace(nxt || (ctx.profile && ctx.profile.role === 'supervisor' ? 'supervision/' : 'home.html')); return; }
      // صفحة «التعليم عن بعد» تقبل أي حساب مدرسي (الطلاب يدخلونها حتى لو كانت بقية المنصة مقفولة عليهم)
      if (ctx && ctx.domain_ok !== false && /^online\//.test(nxt)) { location.replace(nxt); return; }
      // ولي الأمر يدخل من حساب ابنه حتى لو كان دخول الطلاب مقفولًا
      if (ctx && ctx.students_closed && /^parent\.html/.test(nxt)) { location.replace('parent.html'); return; }

      const email = (ctx && ctx.email) || session.user.email || '';
      const msg = ctx && ctx.all_closed
        ? `المنصة مغلقة مؤقتًا للصيانة أو التحديث، وستعود قريبًا بإذن الله.`
        : ctx && ctx.teachers_closed
        ? `دخول المعلمين إلى المنصة غير متاح حاليًا، وسيُعلَن عند فتحه.`
        : ctx && ctx.students_closed
        ? `دخول الطلاب إلى المنصة غير متاح حاليًا، وسيُعلَن عند فتحه.`
        : ctx && ctx.parents_closed
        ? `بوابة أولياء الأمور غير متاحة حاليًا، وستُعلن المدرسة عند فتحها.`
        : ctx && ctx.domain_ok === false
        ? `الحساب <b dir="ltr">${esc(email)}</b> ليس حسابًا مدرسيًا. استخدم بريدك على <b dir="ltr">@${esc(C.SCHOOL_DOMAIN)}</b>.`
        : `الحساب <b dir="ltr">${esc(email)}</b> غير مسجّل في المنصة أو موقوف. ولي الأمر: ادخل بنفس البريد المسجّل لدى المدرسة لابنك. وإلا تواصل مع إدارة المدرسة.`;
      area.innerHTML = `<div class="notice err">${msg}</div>
        ${ctx && ctx.students_closed && !ctx.all_closed ? '<a class="btn primary gbtn" href="parent.html" style="margin-bottom:8px">👪 دخول ولي الأمر (برمزه السري)</a>' : ''}
        <button class="btn gbtn" id="other">الدخول بحساب آخر</button>`;
      $('#other').onclick = async () => { await sb.auth.signOut(); showLogin(); };
    } catch (e) {
      showLogin(`<div class="notice err">${esc(errMsg(e))}</div>`);
    }
  })();
  </script>
</body>
</html>
