  <style>
    .mbox { display: grid; grid-template-columns: 200px minmax(260px, 380px) 1fr; gap: 12px; align-items: start; }
    .folders { padding: 10px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 120px; }
    .folders button { font-family: inherit; text-align: right; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; }
    .folders button.on { background: var(--brand); color: #fff; } .folders button:hover:not(.on) { background: var(--brand2); }
    .folders .cnt { background: #e4a842; color: #3d2600; border-radius: 99px; padding: 0 8px; font-size: .78rem; }
    .mlist { padding: 6px; max-height: 74vh; overflow: auto; }
    .mitem { padding: 10px 12px; border-radius: 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
    .mitem:hover { background: #f7fbfb; } .mitem.on { background: var(--brand2); }
    .mitem.unread b.s { color: var(--brand); } .mitem.unread::before { content: '●'; color: var(--brand); float: left; font-size: .7rem; }
    .mitem b.s { display: block; font-size: .95rem; } .mitem small { color: var(--muted); display: block; }
    .mitem .tags { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
    .reader { padding: 18px 20px; min-height: 300px; }
    .reader h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .reader .meta { color: var(--muted); font-size: .86rem; display: flex; flex-wrap: wrap; gap: 4px 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; }
    .reader .body { white-space: pre-wrap; line-height: 1.9; font-size: 1rem; }
    .reader .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
    .atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .atts a { text-decoration: none; }
    .quote { border-inline-start: 3px solid var(--line); padding: 6px 12px; margin-top: 14px; color: var(--muted); white-space: pre-wrap; }
    .ackbox { background: #fff8e6; border: 1px solid #f1d58a; border-radius: 12px; padding: 10px 14px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .to-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .to-chips .chip { cursor: pointer; } .to-chips .chip::after { content: ' ✕'; }
    .sug { border: 1px solid var(--line); border-radius: 10px; max-height: 200px; overflow: auto; background: #fff; }
    .sug div { padding: 6px 10px; cursor: pointer; } .sug div:hover { background: var(--brand2); }
    .grp-box { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0; }
    .grp-box label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
    .compose label.f { margin-top: 10px; }
    .compose textarea { min-height: 180px; resize: vertical; }
    .progress { height: 8px; background: #eef2f4; border-radius: 99px; overflow: hidden; min-width: 120px; } .progress i { display: block; height: 100%; background: var(--accent); }
    @media (max-width: 900px) { .mbox { grid-template-columns: 1fr; } .folders { position: static; flex-direction: row; flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main class="page">
    <div class="mbox">
      <aside class="folders glass" id="folders">
        <button class="btn primary" id="newMsg" style="justify-content:center;color:#fff">✏️ رسالة جديدة</button>
        <button class="btn" id="newCirc" style="display:none;justify-content:center">📢 تعميم جديد</button>
        <hr style="border:0;border-top:1px solid var(--line);width:100%">
        <button data-box="inbox" class="on">📥 الوارد <span class="cnt" id="cIn" hidden></span></button>
        <button data-box="circ">📢 التعاميم <span class="cnt" id="cCirc" hidden></span></button>
        <button data-box="sent">📤 المرسل</button>
        <button data-box="archive">🗄️ الأرشيف</button>
        <button data-box="board" id="boardBtn" style="display:none">📊 متابعة التعاميم</button>
      </aside>
      <section class="glass mlist" id="mlist"><div class="empty">جارٍ التحميل…</div></section>
      <section class="glass reader" id="reader"><div class="empty">اختر رسالة لعرضها</div></section>
    </div>
  </main>
  <footer class="credit">إعداد وتصميم: مصطفى حسين</footer>
