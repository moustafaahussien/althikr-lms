  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
    .stat { padding: 10px 14px; } .stat b { font-size: 1.4rem; display: block; } .stat small { color: var(--muted); }
    .stat.a b { color: #c0392b; } .stat.l b { color: #d9822b; } .stat.e b { color: #2c7be5; } .stat.p b { color: var(--accent); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { font-family: inherit; border: 0; background: #fff; padding: 5px 10px; cursor: pointer; font-size: .84rem; color: var(--muted); border-inline-start: 1px solid var(--line); }
    .seg button:first-child { border-inline-start: 0; }
    .seg button.on[data-s=""] { background: #e6f6ee; color: var(--accent); font-weight: 700; }
    .seg button.on[data-s=absent] { background: #fdecea; color: #c0392b; font-weight: 700; }
    .seg button.on[data-s=late] { background: #fff3e0; color: #b9691b; font-weight: 700; }
    .seg button.on[data-s=excused] { background: #e8f0fd; color: #2c7be5; font-weight: 700; }
    tr.st-absent td { background: #fff7f6; } tr.st-late td { background: #fffaf2; } tr.st-excused td { background: #f6f9ff; }
    .note-in { width: 160px; padding: 4px 8px; font-size: .84rem; }
    .savebar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; z-index: 5; border-radius: 0 0 var(--radius) var(--radius); }
    .dot { display:inline-block; padding: 0 7px; border-radius: 99px; font-size: .78rem; font-weight: 700; }
    .dot.absent { background:#fdecea; color:#c0392b } .dot.late { background:#fff3e0; color:#b9691b } .dot.excused { background:#e8f0fd; color:#2c7be5 }
  </style>

<body>
  <header id="topbar"></header>
  <main class="page">
    <section class="hero glass">
      <h1>🗓️ الحضور والغياب</h1>
      <p>يسجّل المعلم أو رائد الفصل الحضور اليومي (أو حضور حصة)، ويتابع الوكيل والمدير الغياب والتأخر يوميًا وبالفترة. ولي الأمر يرى حضور ابنه في بوابته.</p>
    </section>
    <nav class="tabs glass" id="tabs">
      <button data-tab="take" class="on">✍️ تسجيل الحضور</button>
      <button data-tab="rep">📈 التقارير</button>
    </nav>
    <section class="tab-pane on" id="tab-take">
      <div class="toolbar glass" style="padding:10px">
        <label class="hint">التاريخ <input type="date" id="day"></label>
        <select id="grp" class="grow"><option value="">— اختر الصف —</option></select>
        <select id="cls"><option value="">كل الفصول</option></select>
        <select id="per"><option value="0">الحضور اليومي</option></select>
        <input id="find" type="search" placeholder="بحث باسم الطالب…" style="width:180px">
      </div>
      <div id="roster"><div class="empty">اختر الصف لعرض الطلاب</div></div>
    </section>
    <section class="tab-pane" id="tab-rep">
      <div class="toolbar glass" style="padding:10px">
        <label class="hint">من <input type="date" id="from"></label>
        <label class="hint">إلى <input type="date" id="to"></label>
        <button class="btn sm" data-r="today">اليوم</button><button class="btn sm" data-r="week">هذا الأسبوع</button><button class="btn sm" data-r="month">آخر 30 يومًا</button>
        <button class="btn primary sm" id="repGo">عرض</button>
      </div>
      <div id="rep"><div class="empty">اختر الفترة ثم «عرض»</div></div>
    </section>
  </main>
  <footer class="credit">إعداد وتصميم: مصطفى حسين</footer>
