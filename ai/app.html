<body>
<div class="msg" id="m">⏳ جارٍ تحميل التطبيق…</div>
<script>
/* تطبيق المعلم يعمل داخل إطار معزول (sandbox) حتى لا يصل لحسابك في المنصة */
(async function () {
  const id = new URLSearchParams(location.search).get('id') || '';
  const m = document.getElementById('m');
  const SHIM = '<script>(function(){function M(){var d={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}["localStorage","sessionStorage"].forEach(function(n){try{window[n].getItem("x")}catch(e){try{Object.defineProperty(window,n,{value:M(),configurable:true})}catch(e2){}}});})();<\/script>';
  const doc = h => /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, x => x + SHIM) : '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' + SHIM + '</head><body>' + h + '</body></html>';
  try {
    const r = await AI_LMS.call('app', { id });
    if (!r || !r.ok) throw new Error((r && r.error) || 'تعذّر فتح التطبيق');
    const g = await AI_LMS.call('get', { id }).catch(() => null);
    if (g && g.item && g.item.title) document.title = g.item.title + ' — المعلم الذكي';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads');
    f.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; microphone; camera');
    f.srcdoc = doc(r.html || '');
    m.replaceWith(f);
  } catch (e) { m.textContent = e.message; }
})();
</script>
</body>
