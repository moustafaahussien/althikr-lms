<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- سياسة أمان: المواقع المسموح للصفحة تحميل الأكواد منها والاتصال بها -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://zpbhzhpvpvehowxvlsgp.supabase.co https://drive.google.com https://*.googleusercontent.com; connect-src 'self' https://zpbhzhpvpvehowxvlsgp.supabase.co wss://zpbhzhpvpvehowxvlsgp.supabase.co; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول ولي الأمر — منصة دار الذكر التعليمية</title>
  <link rel="stylesheet" href="assets/css/brand.css?v=202611270330">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#007B51">
  <link rel="manifest" href="supervision/manifest.json?v=2">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/app.css?v=202611270330">
  <style>
    .pp-wrap { max-width: 760px; margin: 0 auto; }
    .pp-box { padding: 22px; margin-bottom: 16px; }
    .pp-box h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .pin { font-size: 1.6rem; letter-spacing: .5em; text-align: center; direction: ltr; font-family: monospace; width: 100%; max-width: 260px; padding: 10px; }
    .code { font-size: 1.3rem; letter-spacing: .25em; text-align: center; direction: ltr; text-transform: uppercase; font-family: monospace; width: 100%; max-width: 300px; padding: 10px; }
    .gd-pick { display: grid; gap: 8px; margin: 12px 0; }
    .gd-pick label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; }
    .gd-pick label:has(input:checked) { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand2); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .kpi4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .kpi4 .card-box { padding: 10px; }
    .kpi4 b { font-size: 1.4rem; }
    .who-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 14px; }
    .timer { font-size: .82rem; color: var(--muted); }
  </style>
  <script src="assets/vendor/supabase-js-2.119.2.js"></script>
  <script src="assets/js/config.js?v=202611270330"></script>
  <script src="assets/js/i18n.js?v=202611270330"></script>
  <script src="assets/js/core.js?v=202611270330"></script>
  <script src="assets/js/report-card.js?v=202611270330"></script>
  <script src="assets/js/survey-form.js?v=202611270330"></script>
</head>
<body>
  <main class="page pp-wrap">
    <section class="hero glass">
      <h1>👪 دخول ولي الأمر</h1>
      <p>تدخل بحساب ابنك المدرسي، ثم برمزك السري الخاص. لا يُحفظ رمزك على هذا الجهاز، وتُغلق صفحتك تلقائيًا بعد 30 دقيقة من عدم الاستخدام.</p>
    </section>
    <div id="area"><div class="hint" style="text-align:center;padding:30px">⏳ جارٍ التحقق…</div></div>
    <p class="hint" style="text-align:center;margin-top:20px"><a href="index.html">← صفحة الدخول</a></p>
  </main>
<script>
(async function () {
  'use strict';
  const { sb, esc, $, toast, errMsg } = LMS;
  const area = $('#area');
  let TOKEN = '';                 // في الذاكرة فقط — لا localStorage ولا sessionStorage
  let idleT = null, ST = null;
  const IDLE_MIN = 10;            // قفل الصفحة على الجهاز بعد 10 دقائق بلا نشاط (والخادم ينهي الجلسة بعد 30)

  const call = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw error; return data; };

  // 1) لازم حساب الطالب المدرسي
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html?next=parent.html'; return; }

  async function start(msg) {
    TOKEN = ''; clearTimeout(idleT);
    try { ST = await call('pp_status'); }
    catch (e) {
      area.innerHTML = `<div class="notice err">${esc(errMsg(e))}</div>
        <div class="notice info">هذه الصفحة تُفتح من <b>حساب الطالب المدرسي</b> (رقم الهوية@${esc(LMS.C.SCHOOL_DOMAIN)}).</div>
        <button class="btn" id="out">الدخول بحساب آخر</button>`;
      $('#out').onclick = async () => { await sb.auth.signOut(); location.href = 'index.html?next=parent.html'; };
      return;
    }
    const gs = ST.guardians || [];
    if (!gs.length) {
      area.innerHTML = `<div class="glass pp-box"><h2>الطالب: ${esc(ST.student)}</h2>
        <div class="notice warn">لا يوجد رقم جوال ولي أمر مسجّل لهذا الطالب في المدرسة. تواصل مع إدارة المدرسة لتسجيل رقمك وإرسال رمز التفعيل لك على واتساب.</div></div>`;
      return;
    }
    area.innerHTML = `<div class="glass pp-box">
      <h2>الطالب: ${esc(ST.student)}</h2>
      ${msg ? `<div class="notice info">${esc(msg)}</div>` : ''}
      <div class="hint">اختر ولي الأمر:</div>
      <div class="gd-pick">${gs.map((g, i) => `<label><input type="radio" name="gd" value="${esc(g.id)}" ${i === 0 ? 'checked' : ''}>
        <span><b>${esc(g.name || 'ولي الأمر')}</b> <span class="hint" dir="ltr">${esc(g.phone)}</span>
        ${g.locked ? '<span class="chip pink">مقفل</span>' : g.has_pin ? '' : '<span class="chip gray">لم يُفعَّل</span>'}</span></label>`).join('')}</div>
      <div id="step"></div></div>`;
    const pick = () => gs.find((g) => g.id === (area.querySelector('input[name=gd]:checked') || {}).value) || gs[0];
    area.querySelectorAll('input[name=gd]').forEach((r) => r.onchange = () => step(pick()));
    step(pick());
  }

  // 2) الرمز السري، أو رمز التفعيل لأول مرة/بعد القفل
  function step(g, forceActivate) {
    const box = $('#step');
    if (!g.has_pin || g.locked || forceActivate) {
      box.innerHTML = `<h3 style="margin:14px 0 6px;font-size:1rem">تفعيل الدخول</h3>
        <p class="hint" style="margin:0 0 10px">اكتب <b>رمز التفعيل</b> الذي وصلك من المدرسة على واتساب، ثم اختر رمزًا سريًا من 6 أرقام تستخدمه في كل مرة. لا تُطلع ابنك عليه.</p>
        <label class="f">رمز التفعيل<input id="ac" class="code" maxlength="8" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false"></label>
        <label class="f">الرمز السري الجديد (6 أرقام)<input id="p1" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
        <label class="f">أعد كتابة الرمز السري<input id="p2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
        <div class="row"><button class="btn primary" id="go">تفعيل والدخول</button>
          ${g.has_pin && !g.locked ? '<button class="btn" id="back">لدي رمز سري</button>' : ''}</div>
        <div class="hint" style="margin-top:10px">لم يصلك رمز تفعيل أو انتهت صلاحيته (14 يومًا)؟ تواصل مع إدارة المدرسة.</div>`;
      const b = $('#back'); if (b) b.onclick = () => step(g);
      $('#go').onclick = async () => {
        const code = $('#ac').value.trim().toUpperCase(), p1 = $('#p1').value.trim(), p2 = $('#p2').value.trim();
        if (code.length < 8) return toast('اكتب رمز التفعيل كاملًا (8 خانات)', 'err');
        if (!/^\d{6}$/.test(p1)) return toast('الرمز السري 6 أرقام', 'err');
        if (p1 !== p2) return toast('الرمزان غير متطابقين', 'err');
        $('#go').disabled = true;
        try { const r = await call('pp_activate', { p_code: code, p_pin: p1 }); TOKEN = r.token; await showKids(); toast('تم التفعيل ✓ — احفظ رمزك السري'); }
        catch (e) { toast(errMsg(e), 'err'); $('#go').disabled = false; }
      };
      return;
    }
    box.innerHTML = `<label class="f" style="margin-top:12px">الرمز السري (6 أرقام)<input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      <div class="row"><button class="btn primary" id="go">دخول</button><button class="btn" id="forgot">نسيت الرمز / لدي رمز تفعيل جديد</button></div>`;
    $('#forgot').onclick = () => step(g, true);
    const go = async () => {
      const pin = $('#pin').value.trim();
      if (!/^\d{6}$/.test(pin)) return toast('الرمز السري 6 أرقام', 'err');
      $('#go').disabled = true;
      try {
        const r = await call('pp_login', { p_guardian: g.id, p_pin: pin });
        if (!r.ok) { $('#pin').value = ''; $('#go').disabled = false; toast(r.error, 'err'); if (/قفل/.test(r.error)) start(r.error); return; }
        TOKEN = r.token; await showKids();
      } catch (e) { toast(errMsg(e), 'err'); $('#go').disabled = false; }
    };
    $('#go').onclick = go;
    $('#pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    setTimeout(() => $('#pin') && $('#pin').focus(), 50);
  }

  // 3) صفحة ولي الأمر
  const STL = { absent: 'غائب', late: 'متأخر', excused: 'غائب بعذر' };
  async function showKids() {
    let d;
    try { d = await call('pp_children', { p_token: TOKEN }); }
    catch (e) { return start(errMsg(e)); }
    armIdle();
    const kids = d.children || [];
    area.innerHTML = `<div class="glass who-bar"><span>👤 <b>${esc(d.guardian.name || 'ولي الأمر')}</b> <span class="hint" dir="ltr">${esc(d.guardian.phone)}</span></span>
        <span class="row" style="margin:0"><span class="timer" id="tmr"></span><button class="btn sm" id="chg">تغيير الرمز السري</button><button class="btn sm danger" id="lo">خروج ولي الأمر</button></span></div>
      ${kids.length ? kids.map(card).join('') : '<div class="notice info">لا يوجد أبناء مرتبطون برقمك بعد.</div>'}
      <div id="ppMeet"></div><div id="ppSrv"></div>`;
    $('#lo').onclick = logout;
    loadMeet(); loadSurveys();
    $('#chg').onclick = changePin;
    area.onclick = (e) => { const b = e.target.closest('[data-rc]'); if (!b) return; const [k, i] = b.dataset.rc.split(':'); const c = kids.find((x) => x && x.id === k);
      if (c && window.RC) RC.print([c.report_cards[+i]]); };
  }
  // لقاءات أولياء الأمور
  const MODE = { in_person: '🏫 حضوري', online: '💻 عن بُعد', phone: '📞 هاتفي' };
  async function loadMeet() {
    const box = $('#ppMeet'); if (!box) return;
    let M = [], T = [];
    try { [M, T] = await Promise.all([call('pp_meet_mine', { p_token: TOKEN }), call('pp_meet_staff', { p_token: TOKEN })]); } catch (e) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="card glass" style="margin-bottom:14px"><div class="section-title" style="margin-top:0"><h2>🤝 لقاءات المعلمين</h2></div>
      ${M.map((m) => `<div class="card-box" style="margin-bottom:6px;display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(m.teacher)}</b> — ${esc(m.day)} الساعة ${esc(m.time)}
          <div class="hint">${MODE[m.mode] || ''}${m.location ? ' · ' + esc(m.location) : ''} · بخصوص ${esc(m.student || '')}${m.topic ? ' · ' + esc(m.topic) : ''}</div>
          ${m.status === 'cancelled' ? '<div class="hint" style="color:#c0392b">⚠️ ألغى المعلم هذا الموعد — يمكنك حجز موعد آخر</div>' : ''}</div>
        ${m.status === 'booked' ? `<button class="btn sm danger ghost" data-mc="${m.id}">إلغاء الحجز</button>` : ''}</div>`).join('')}
      <p class="hint">اختر المعلم لعرض مواعيده المتاحة:</p>
      <div class="grid modules">${T.map((t) => `<button class="module glass" style="text-align:start;cursor:pointer" data-mt="${t.id}" data-ms="${t.student_id}"><span class="ic">👤</span><b>${esc(t.name)}</b>
        <small>${esc(t.why || '')} · ${esc(t.student || '')}</small><small style="color:${t.open ? 'var(--accent)' : '#999'}">${t.open ? t.open + ' موعد متاح' : 'لا مواعيد متاحة حاليًا'}</small></button>`).join('') || '<div class="hint">لا يوجد معلمون مسندون لفصول أبنائك بعد.</div>'}</div></div>`;
    box.onclick = async (e) => {
      const c = e.target.closest('[data-mc]'), t = e.target.closest('[data-mt]');
      try {
        if (c) { if (!await LMS.confirmBox('إلغاء حجز هذا الموعد؟', 'إلغاء الحجز')) return; await call('pp_meet_cancel', { p_token: TOKEN, p_slot: +c.dataset.mc }); toast('أُلغي الحجز'); loadMeet(); }
        if (t) {
          const S = await call('pp_meet_slots', { p_token: TOKEN, p_teacher: t.dataset.mt });
          if (!S.length) return toast('لا توجد مواعيد متاحة لهذا المعلم حاليًا', 'warn');
          LMS.modal({ title: 'حجز لقاء', body: `<label class="f">اختر الموعد<select id="sl">${S.map((x) => `<option value="${x.id}">${esc(x.day)} — ${esc(x.time)} (${x.duration} د) ${MODE[x.mode] || ''}${x.location ? ' — ' + esc(x.location) : ''}</option>`).join('')}</select></label>
              <label class="f">موضوع اللقاء (اختياري)<textarea id="tp" rows="3" maxlength="500" placeholder="مثال: الاستفسار عن مستوى ابني في المادة"></textarea></label>`,
            actions: [{ label: 'إلغاء', value: null, cls: 'ghost' }, { label: 'تأكيد الحجز', cls: 'primary', onClick: async (w) => {
              await call('pp_meet_book', { p_token: TOKEN, p_slot: +w.querySelector('#sl').value, p_student: t.dataset.ms, p_topic: w.querySelector('#tp').value });
              toast('تم الحجز ✓ — وصل إشعار للمعلم'); loadMeet(); return true; } }] });
        }
      } catch (er) { toast(errMsg(er), 'err'); }
    };
  }
  // الاستبيانات
  async function loadSurveys() {
    const box = $('#ppSrv'); if (!box || !window.SRV) return;
    let L = [];
    try { L = await call('pp_surveys', { p_token: TOKEN }); } catch (e) { return; }
    if (!L.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<div class="card glass" style="margin-bottom:14px"><div class="section-title" style="margin-top:0"><h2>📝 استبيانات المدرسة</h2></div>
      ${L.map((v) => `<div class="card-box" style="margin-bottom:6px;display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(v.title)}</b><div class="hint">${v.questions.length} سؤال${v.closes_at ? ' · حتى ' + esc(v.closes_at) : ''}</div></div>
        ${v.done ? '<span class="hint" style="color:var(--accent)">✓ شكرًا لمشاركتك</span>' : `<button class="btn sm primary" data-sv="${v.id}">شارك</button>`}</div>`).join('')}</div>`;
    box.onclick = (e) => { const b = e.target.closest('[data-sv]'); if (!b) return; const v = L.find((x) => x.id === +b.dataset.sv);
      LMS.modal({ title: '📝 ' + v.title, wide: true, body: SRV.form(v), actions: [{ label: 'إلغاء', value: null, cls: 'ghost' }, { label: 'إرسال', cls: 'primary', onClick: async (w) => {
        const a = SRV.collect(w, v); await call('pp_survey_submit', { p_token: TOKEN, p_id: v.id, p_answers: a }); toast('شكرًا لمشاركتك ✓'); loadSurveys(); return true; } }] });
      SRV.bind([...document.querySelectorAll('.modal-wrap')].pop()); };
  }
  function card(c) {
    if (!c) return '';
    const a = c.attendance || {};
    const pct = a.days_taken ? Math.round((1 - (a.absent + a.excused) / a.days_taken) * 100) : null;
    return `<div class="card glass" style="margin-bottom:14px">
      <div class="section-title" style="margin-top:0"><h2>🎓 ${esc(c.name)}</h2><span class="hint">${esc(c.grade || '')}${c.class ? ' / فصل ' + esc(c.class) : ''}</span></div>
      <div class="kpi4">
        <div class="card-box"><b style="color:var(--accent)">${pct == null ? '—' : pct + '%'}</b><div class="hint">نسبة الحضور (60 يومًا)</div></div>
        <div class="card-box"><b style="color:#c0392b">${a.absent || 0}</b><div class="hint">غياب</div></div>
        <div class="card-box"><b style="color:#b9691b">${a.late || 0}</b><div class="hint">تأخر</div></div>
        <div class="card-box"><b style="color:#509BB9">${a.excused || 0}</b><div class="hint">غياب بعذر</div></div></div>
      ${(a.recent || []).length ? `<details style="margin-top:10px"><summary class="hint" style="cursor:pointer">سجل الغياب والتأخر</summary><div class="table-wrap no-tools" style="margin-top:6px"><table>
        <thead><tr><th>التاريخ</th><th>هجري</th><th>الحصة</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${a.recent.map((r) => `<tr><td>${esc(r.d)}</td><td>${esc(LMS.hijri(r.d))}</td>
        <td>${r.p ? r.p : 'يومي'}</td><td>${STL[r.s] || r.s}</td><td>${esc(r.n || '')}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
      ${behavior(c.behavior)}
      ${examsBox(c.exams)}
      ${clinicBox(c.clinic)}
      ${cardsBox(c)}
      <h3 style="margin:14px 0 8px;font-size:1rem">المعلمون</h3>
      ${(c.teachers || []).length ? `<div class="grid modules">${c.teachers.sort((x, y) => (x.subject || '').localeCompare(y.subject || '', 'ar')).map((t) => `
        <div class="module glass"><span class="ic">📚</span><b>${esc(t.subject)}</b><small>${esc(t.name)}</small></div>`).join('')}</div>`
        : '<div class="hint">لم تُسند مواد لهذا الصف بعد.</div>'}
    </div>`;
  }
  function clinicBox(L) {
    if (!(L || []).length) return '';
    return `<h3 style="margin:14px 0 8px;font-size:1rem">🩺 زيارات العيادة المدرسية <span class="hint">(آخر 60 يومًا)</span></h3>` + L.map((v) => `<div style="border-inline-start:4px solid #509BB9;padding:6px 10px;margin:6px 0;background:#f6fafc;border-radius:8px">
      <b>${esc(v.complaint)}</b> — ${esc(v.action)}${v.notes ? `<div class="hint">${esc(v.notes)}</div>` : ''}<div class="hint">${new Date(v.at).toLocaleString('ar-SA-u-ca-gregory', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</div></div>`).join('');
  }
  function examsBox(L) {
    if (!(L || []).length) return '';
    const DN = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    return L.map((x) => `<h3 style="margin:14px 0 8px;font-size:1rem">📋 ${esc(x.session)}</h3>
      <div class="kpi4"><div class="card-box"><b style="color:var(--accent)">${x.seat}</b><div class="hint">رقم الجلوس</div></div>
        <div class="card-box"><b>${esc(x.room)}</b><div class="hint">${esc(x.location || 'اللجنة')}</div></div></div>
      <div class="table-wrap no-tools" style="margin-top:6px"><table><thead><tr><th>اليوم</th><th>التاريخ</th><th>المادة</th><th>البداية</th><th>المدة</th></tr></thead><tbody>
      ${x.schedule.map((s) => `<tr><td>${DN[new Date(s.day + 'T12:00:00').getDay()]}</td><td>${esc(s.day)}</td><td><b>${esc(s.subject)}</b></td><td>${esc(s.start || '—')}</td><td>${s.duration} د</td></tr>`).join('')}</tbody></table></div>`).join('');
  }
  function cardsBox(c) {
    const L = c.report_cards || [];
    if (!L.length) return '';
    return `<h3 style="margin:14px 0 8px;font-size:1rem">📜 الشهادات الفصلية</h3>` + L.map((r, i) => `<div class="card-box" style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
      <div style="flex:1"><b>${esc(r.issue.title)}</b><div class="hint">${esc(r.issue.term || '')} · المعدل ${r.avg != null ? r.avg + '%' : '—'} — ${esc(r.label || '')}</div></div>
      <button class="btn sm primary" data-rc="${esc(c.id)}:${i}">📜 عرض وطباعة</button></div>`).join('');
  }
  function behavior(b) {
    if (!b || !(b.notes || []).length) return '';
    const pos = b.notes.filter((n) => n.kind === 'positive').length, neg = b.notes.length - pos;
    return `<h3 style="margin:14px 0 8px;font-size:1rem">🌟 السلوك والمواظبة <span class="hint">(آخر 90 يومًا)</span></h3>
      <div class="kpi4"><div class="card-box"><b style="color:#b8860b">⭐ ${b.points || 0}</b><div class="hint">نقاط التميز</div></div>
        <div class="card-box"><b style="color:var(--accent)">${pos}</b><div class="hint">ملاحظة إيجابية</div></div>
        <div class="card-box"><b style="color:#c0392b">${neg}</b><div class="hint">ملاحظة تحتاج متابعتكم</div></div></div>
      <details style="margin-top:8px" ${neg ? 'open' : ''}><summary class="hint" style="cursor:pointer">تفاصيل الملاحظات</summary>
      ${b.notes.map((n) => `<div style="border-inline-start:4px solid ${n.kind === 'positive' ? '#e0b000' : '#c0392b'};padding:6px 10px;margin:6px 0;background:#fafbfa;border-radius:8px">
        ${n.kind === 'positive' ? '⭐' : '⚠️'} <b>${esc(n.text)}</b>${n.kind === 'positive' && n.points ? ` <span class="hint">+${n.points}</span>` : ''}
        ${n.details ? `<div class="hint">${esc(n.details)}</div>` : ''}<div class="hint">${esc(n.date)} (${esc(LMS.hijri(n.date))}) — ${esc(n.by || '')}</div></div>`).join('')}</details>`;
  }
  function changePin() {
    LMS.modal({ title: 'تغيير الرمز السري', body: `
      <label class="f">الرمز الحالي<input id="o" class="pin" type="password" inputmode="numeric" maxlength="6"></label>
      <label class="f">الرمز الجديد<input id="n1" class="pin" type="password" inputmode="numeric" maxlength="6"></label>
      <label class="f">أعد كتابة الجديد<input id="n2" class="pin" type="password" inputmode="numeric" maxlength="6"></label>`,
      actions: [{ label: 'إلغاء', value: null, cls: 'ghost' }, { label: 'حفظ', cls: 'primary', onClick: async (w) => {
        const o = w.querySelector('#o').value, n1 = w.querySelector('#n1').value, n2 = w.querySelector('#n2').value;
        if (!/^\d{6}$/.test(n1) || n1 !== n2) { toast('الرمز الجديد 6 أرقام ويجب تطابقه', 'err'); return false; }
        await call('pp_change_pin', { p_token: TOKEN, p_old: o, p_new: n1 }); toast('تم تغيير الرمز السري ✓'); return true; } }] });
  }
  async function logout(reason) {
    const t = TOKEN; TOKEN = '';
    if (t) { try { await call('pp_logout', { p_token: t }); } catch (_) {} }
    start(typeof reason === 'string' ? reason : 'تم خروج ولي الأمر.');
  }
  // قفل تلقائي عند عدم النشاط، وعند إخفاء الصفحة طويلًا
  let last = Date.now();
  function armIdle() {
    last = Date.now(); clearTimeout(idleT);
    const tick = () => {
      if (!TOKEN) return;
      const left = IDLE_MIN * 60 - Math.floor((Date.now() - last) / 1000);
      const el = $('#tmr'); if (el) el.textContent = 'تُغلق بعد ' + Math.max(0, Math.ceil(left / 60)) + ' د';
      if (left <= 0) return logout('أُغلقت صفحة ولي الأمر لعدم النشاط.');
      idleT = setTimeout(tick, 15000);
    };
    tick();
  }
  ['click', 'keydown', 'touchstart', 'scroll'].forEach((ev) => document.addEventListener(ev, () => { last = Date.now(); }, { passive: true }));
  window.addEventListener('pagehide', () => { if (TOKEN) { try { sb.rpc('pp_logout', { p_token: TOKEN }); } catch (_) {} } });

  start();
})();
</script>
</body>
</html>
